[project]
name = "escriba-ocr"
version = "1.0.0"
description = "Benchmark, training and evaluation code for Escriba-OCR-1B: error-preserving transcription of handwritten Brazilian Portuguese essays"
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
bench = ["rapidfuzz>=3.9", "spylls>=0.1.7", "numpy>=1.26", "matplotlib>=3.8"]
train = ["torch>=2.6", "transformers==5.22.1", "safetensors", "huggingface_hub", "peft"]
serve = ["vllm>=0.34"]

[project.scripts]
escriba = "escriba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["escriba"]
